<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&amp;family=Big+Shoulders+Display:wght@600..900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C84B}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F2E45; color: #EAF2F7; font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <header style="padding: 28px 20px 0; text-align: center">
    <div style="font-size: 15px; font-weight: 700; color: #F5C84B">Quest complete</div>
    <h1 style="margin: 4px 0 0; font: 900 52px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.5px">Cascadia</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #9DB7C9">You placed 2nd, 3 behind Priya</p>
  </header>

  <section aria-label="A forest tile joins your world" style="position: relative; height: 228px; margin-top: 10px">
    <sc-for list="{{neighbors}}" as="n" hint-placeholder-count="6">
      <div aria-hidden="true" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 72px; height: 83px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: {{n.c}}; opacity: 0.35"></div>
    </sc-for>
    <div aria-hidden="true" style="position: absolute; left: 131px; top: 36px; width: 128px; height: 148px">
      <div style="position: absolute; inset: -8px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #F5C84B"></div>
      <div style="position: absolute; left: 0; right: 0; top: 12px; height: 148px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #245C38"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 148px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #3E9B5F; display: flex; align-items: center; justify-content: center">
        <svg width="54" height="54" viewBox="0 0 24 24"><path d="M12 2 18 11h-3.5l4.5 7H5l4.5-7H6z" fill="#FFFFFF"></path></svg>
      </div>
    </div>
  </section>
  <p style="margin: 0; text-align: center; font-size: 15px; font-weight: 600">A forest tile joins your world. That makes 27.</p>

  <section style="margin: 16px 16px 0; background: #17405E; border-radius: 16px; padding: 6px 16px 14px">
    <sc-for list="{{xp}}" as="x" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 38px; border-bottom: 1px solid #23506F">
        <span style="font-size: 15px">{{x.label}}</span>
        <span style="font: 800 20px 'Big Shoulders Display', sans-serif; color: #F5C84B">+{{x.amount}}</span>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px">
      <span style="font-size: 13px; color: #9DB7C9">Level 14, 2,430 of 3,000 XP</span>
      <span style="font: 900 24px 'Big Shoulders Display', sans-serif">+90 XP</span>
    </div>
    <div aria-hidden="true" style="height: 10px; margin-top: 8px; border-radius: 5px; background: #0A2236; overflow: hidden; display: flex">
      <div style="width: 78%; background: #C9A23C"></div>
      <div style="width: 3%; background: #FFE08A"></div>
    </div>
  </section>

  <section style="margin: 10px 16px 0; background: #2A2353; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C7B5F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"></circle><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"></path></svg>
    <div style="flex: 1">
      <div style="font-size: 15px; font-weight: 700">Bridesmaid, 4 of 5</div>
      <div style="font-size: 13px; color: #C7B5F2">Four second places in a row. One more and the title is yours.</div>
    </div>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
    <a href="ShareCard.dc.html" style="height: 54px; border-radius: 27px; border: 1.5px solid #2D5878; color: #EAF2F7; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700">Share</a>
    <a href="Main.dc.html" style="height: 54px; border-radius: 27px; background: #F5C84B; color: #0F2E45; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">See your world</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cx = 195, cy = 110, w = 72, h = 83;
    var ring = [[1, 0, '#3E9B5F'], [0, 1, '#C0563A'], [-1, 1, '#E3B341'], [-1, 0, '#3E9B5F'], [0, -1, '#E86A8A'], [1, -1, '#7B5CC4']];
    var neighbors = ring.map(function (n) {
      var q = n[0] * 1.55, r = n[1] * 1.55;
      return { x: cx + w * (q + r / 2) - w / 2, y: cy + 0.75 * h * r - h / 2, c: n[2] };
    });
    var xp = [
      { label: 'Showed up for the quest', amount: 40 },
      { label: 'Second place', amount: 30 },
      { label: 'Kept your rivalry with Priya alive', amount: 20 }
    ];
    return { neighbors: neighbors, xp: xp };
  }
}
</script>
</body>
</html>
