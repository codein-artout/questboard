<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest complete: tier up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&amp;family=Big+Shoulders+Display:wght@600..900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C84B}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F2E45; color: #EAF2F7; font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <header style="padding: 28px 20px 0; text-align: center">
    <div style="font-size: 15px; font-weight: 700; color: #F5C84B">Quest complete, play 25</div>
    <h1 style="margin: 4px 0 0; font: 900 50px/1 'Big Shoulders Display', sans-serif">Wingspan rises</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #9DB7C9">From a Town to a Keep</p>
  </header>

  <section aria-label="Wingspan tile goes from Town to Keep" style="display: flex; align-items: center; justify-content: center; gap: 18px; height: 200px; margin-top: 8px">
    <div aria-hidden="true" style="position: relative; width: 70px; height: 86px; opacity: 0.55">
      <div style="position: absolute; left: 0; right: 0; top: 8px; height: 78px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #245C38"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 78px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #3E9B5F; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24"><path d="M1 15l3.5-3.5L8 15v5H1z M7.5 12.5 12 8l4.5 4.5V20h-9z M17 7h5v13h-5z M17 7l2.5-3L22 7z" fill="#FFFFFF"></path></svg>
      </div>
    </div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9DB7C9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
    <div aria-hidden="true" style="position: relative; width: 132px; height: 160px">
      <div style="position: absolute; left: -8px; right: -8px; top: -8px; height: 164px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #F5C84B"></div>
      <div style="position: absolute; left: 0; right: 0; top: 12px; height: 148px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #245C38"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 148px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #3E9B5F; display: flex; align-items: center; justify-content: center">
        <svg width="76" height="76" viewBox="0 0 24 24"><path d="M6 5h2.5v2.5H11V5h2v2.5h2.5V5H18v15H6z" fill="#FFFFFF"></path></svg>
      </div>
      <svg width="34" height="34" viewBox="0 0 24 24" style="position: absolute; right: -2px; top: 6px"><path d="M3 8l4.5 3L12 4l4.5 7L21 8l-2 10H5z" fill="#F5C84B" stroke="#0F2E45" stroke-width="1.5" stroke-linejoin="round"></path></svg>
    </div>
  </section>

  <section style="margin: 6px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
    <div style="padding: 12px 14px; border-radius: 14px; background: #F5C84B; color: #0F2E45">
      <div style="font-size: 13px; font-weight: 600">Crown taken</div>
      <div style="font-size: 14px; font-weight: 700; margin-top: 2px; line-height: 1.3">You took the Wingspan crown from Arjun</div>
    </div>
    <div style="padding: 12px 14px; border-radius: 14px; background: #17405E">
      <div style="font-size: 13px; color: #9DB7C9">Personal best</div>
      <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 2px">
        <span style="font: 900 30px/1 'Big Shoulders Display', sans-serif">112</span>
        <span style="font-size: 13px; color: #9DB7C9">was 109</span>
      </div>
    </div>
  </section>

  <section style="margin: 8px 16px 0; background: #17405E; border-radius: 16px; padding: 6px 16px 14px">
    <sc-for list="{{xp}}" as="x" hint-placeholder-count="4">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 36px; border-bottom: 1px solid #23506F">
        <span style="font-size: 14px">{{x.label}}</span>
        <span style="font: 800 20px 'Big Shoulders Display', sans-serif; color: #F5C84B">+{{x.amount}}</span>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px">
      <span style="font-size: 13px; color: #9DB7C9">Level 14, 2,500 of 3,000 XP</span>
      <span style="font: 900 24px 'Big Shoulders Display', sans-serif">+160 XP</span>
    </div>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
    <a href="ShareCard.dc.html" style="height: 54px; border-radius: 27px; border: 1.5px solid #2D5878; color: #EAF2F7; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700">Share</a>
    <a href="TileDetail.dc.html" style="height: 54px; border-radius: 27px; background: #F5C84B; color: #0F2E45; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">See the tile</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { xp: [
      { label: 'Showed up', amount: 40 },
      { label: 'First place', amount: 30 },
      { label: 'Reached a Keep', amount: 50 },
      { label: 'Took a crown', amount: 40 }
    ] };
  }
}
</script>
</body>
</html>
