<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your island</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&amp;family=Big+Shoulders+Display:wght@600..900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C84B}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F2E45; color: #EAF2F7; font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <header style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 0">
    <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 23px; background: #2459B8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 900 22px 'Big Shoulders Display', sans-serif; box-shadow: 0 0 0 3px #0F2E45, 0 0 0 5px #F5C84B">C</span>
    <div style="flex: 1">
      <div style="font: 900 26px/1 'Big Shoulders Display', sans-serif">Ciao’s island</div>
      <div style="font-size: 13px; color: #9DB7C9; margin-top: 3px">27 games, 252 plays, h-index 8</div>
    </div>
    <button aria-label="Notifications" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #EAF2F7; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    </button>
  </header>

  <div role="group" aria-label="View" style="display: flex; gap: 4px; margin: 12px 16px 0; padding: 4px; border-radius: 22px; background: #0A2236; width: fit-content">
    <button onClick="{{showMap}}" aria-pressed="{{isMap}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{mapBg}}; color: {{mapFg}}; font: 700 14px 'Archivo', sans-serif">Map</button>
    <button onClick="{{showList}}" aria-pressed="{{isList}}" style="height: 36px; padding: 0 18px; border: 0; border-radius: 18px; background: {{listBg}}; color: {{listFg}}; font: 700 14px 'Archivo', sans-serif">List</button>
  </div>

  <sc-if value="{{isMap}}" hint-placeholder-val="{{ true }}">
    <section aria-label="Your island: 27 game tiles" style="position: relative; width: 358px; height: 322px; margin: 6px 16px 0">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="37">
        <button onClick="{{t.pick}}" aria-label="{{t.label}}" style="position: absolute; left: {{t.x}}px; top: {{t.y}}px; width: 50px; height: 58px; padding: 0; border: 0; background: transparent; cursor: pointer">
          <div style="position: absolute; inset: -4px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: {{t.glow}}"></div>
          <div style="position: absolute; left: 1px; right: 1px; top: 6px; height: 56px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: {{t.side}}"></div>
          <div style="position: absolute; left: 1px; right: 1px; top: 0; height: 56px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: {{t.face}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <svg width="{{t.size}}" height="{{t.size}}" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.building}}" fill="{{t.ink}}"></path></svg>
            <span aria-hidden="true" style="font: 800 11px/1 'Big Shoulders Display', sans-serif; letter-spacing: 0.2px; color: {{t.ink}}; white-space: nowrap">{{t.mono}}</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 2px; top: 6px; opacity: {{t.crown}}"><path d="M3 8l4.5 3L12 4l4.5 7L21 8l-2 10H5z" fill="#F5C84B" stroke="#0F2E45" stroke-width="1.5" stroke-linejoin="round"></path></svg>
        </button>
      </sc-for>
    </section>

    <section aria-live="polite" style="margin: 6px 16px 0; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #17405E; box-shadow: inset 0 0 0 1.5px #F5C84B">
      <div style="min-width: 0">
        <div style="font: 900 24px/1.05 'Big Shoulders Display', sans-serif">{{sel.name}}</div>
        <div style="font-size: 13px; color: #9DB7C9; margin-top: 2px">{{sel.line}}</div>
      </div>
      <a href="{{sel.href}}" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #F5C84B; color: #0F2E45; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 800">{{sel.cta}}</a>
    </section>
  </sc-if>

  <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
    <section aria-label="Your games, most played first" style="margin: 10px 16px 0; height: 400px; overflow: hidden; border-radius: 16px; background: #17405E">
      <sc-for list="{{list}}" as="g" hint-placeholder-count="8">
        <a href="TileDetail.dc.html" style="display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 8px 14px; min-height: 44px; border-bottom: 1px solid #23506F; text-decoration: none; color: #EAF2F7">
          <span aria-hidden="true" style="width: 28px; height: 32px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: {{g.face}}; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="{{g.building}}" fill="{{g.ink}}"></path></svg>
          </span>
          <span style="font-size: 15px; font-weight: 600">{{g.name}} <span style="font-size: 12px; font-weight: 500; color: #9DB7C9">{{g.tier}}</span></span>
          <span style="font: 900 20px 'Big Shoulders Display', sans-serif">{{g.plays}}</span>
        </a>
      </sc-for>
    </section>
  </sc-if>

  <a href="TileDetail.dc.html" style="margin: 8px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #17405E; text-decoration: none; color: #EAF2F7">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v2.5H11V5h2v2.5h2.5V5H18v15H6z" fill="#F5C84B"></path></svg>
    <div style="flex: 1">
      <div style="font-size: 15px; font-weight: 700">Azul is 3 plays from a Keep</div>
      <div style="font-size: 13px; color: #9DB7C9">5 uncharted games wait on your shelf</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9DB7C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
  </a>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #0A2236; border-top: 1px solid #1C4462; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 8px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F5C84B; font-size: 11px; font-weight: 700; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 20.5 7v10L12 22 3.5 17V7z"></path></svg>Island</a>
    <a href="QuestLog.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9DB7C9; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>Quests</a>
    <a href="LogPlay.dc.html" aria-label="Log a quest" style="justify-self: center; margin-top: -26px; width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #0F2E45; background: #F5C84B; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></a>
    <a href="Shelf.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9DB7C9; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M3 18h18"></path><path d="M6 6v12"></path><path d="M10 9v9"></path><path d="M14 6v12"></path><path d="m17 8 3 10"></path></svg>Shelf</a>
    <a href="Guild.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9DB7C9; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4a1 1 0 0 1 1-1h13l-3 5 3 5H5"></path></svg>Guild</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'map', sel: '0,0' };
  }
  renderVals() {
    var self = this;
    var T = {
      forest: ['#3E9B5F', '#245C38', '#FFFFFF'], peaks: ['#C0563A', '#7A3222', '#FFFFFF'], meadow: ['#E3B341', '#94711F', '#2B2004'],
      marsh: ['#7B5CC4', '#4B3582', '#FFFFFF'], reef: ['#E86A8A', '#9C3F57', '#FFFFFF'], tundra: ['#C9D3DB', '#7D8A95', '#16293A']
    };
    var B = {
      Outpost: 'M10 3h1.6v17H10z M11.6 3l7 3.2-7 3.2z',
      Village: 'M2 14l5-5 5 5v6H2z M11 12.5l5.5-5.5 5.5 5.5V20H11z',
      Town: 'M1 15l3.5-3.5L8 15v5H1z M7.5 12.5 12 8l4.5 4.5V20h-9z M17 7h5v13h-5z M17 7l2.5-3L22 7z',
      Keep: 'M6 5h2.5v2.5H11V5h2v2.5h2.5V5H18v15H6z',
      Citadel: 'M1 9h2v2h2V9h2v11H1z M17 9h2v2h2V9h2v11h-6z M7 13h10v7H7z M9.5 4h1.5v1.5h2V4h1.5v9h-5z',
      Wonder: 'M12 1l2.6 7h-1.2v10h-2.8V8H9.4z M5 18h14v3H5z M3 21h18v2H3z'
    };
    var SIZE = { Outpost: 14, Village: 17, Town: 19, Keep: 21, Citadel: 23, Wonder: 24 };
    var NEXT = { Outpost: [5, 'Village'], Village: [10, 'Town'], Town: [25, 'Keep'], Keep: [50, 'Citadel'], Citadel: [100, 'Wonder'] };
    var MONO = { 'The Crew': 'Crew', 'Terraforming Mars': 'T. Mars', 'Spirit Island': 'Spirit', 'Blood on the Clocktower': 'BotC',
      'The Resistance': 'Resist.', 'Dune: Imperium': 'Dune', 'Twilight Imperium': 'TI4', 'Forbidden Island': 'F. Island',
      'Telestrations': 'Telestr.', 'Gloomhaven': 'Gloom', 'Wavelength': 'Wave' };
    function tier(p) { return p >= 100 ? 'Wonder' : p >= 50 ? 'Citadel' : p >= 25 ? 'Keep' : p >= 10 ? 'Town' : p >= 5 ? 'Village' : 'Outpost'; }
    var games = [
      [0, 0, 'Cascadia', 'forest', 52, 0, 'Priya holds the crown'], [1, 0, 'Wingspan', 'forest', 31, 1, 'You hold the crown'], [0, 1, 'The Crew', 'meadow', 27, 1, 'You hold the crown'],
      [-1, 0, 'Azul', 'tundra', 22, 0, 'Meera holds the crown'], [0, -1, 'Codenames', 'reef', 18, 0, ''], [1, -1, 'Terraforming Mars', 'forest', 11, 0, 'Arjun holds the crown'],
      [-1, 1, 'Catan', 'peaks', 12, 0, 'Ravi holds the crown'], [2, -1, 'Everdell', 'forest', 8, 0, ''], [-2, 1, 'Root', 'peaks', 7, 1, 'You hold the crown'],
      [1, 1, 'Spirit Island', 'meadow', 9, 0, ''], [0, -2, 'Wavelength', 'reef', 5, 0, ''], [1, -2, 'Just One', 'reef', 4, 0, ''],
      [-2, 0, 'Hive', 'tundra', 4, 0, ''], [-2, -1, 'Santorini', 'tundra', 2, 0, ''], [2, 0, 'Ark Nova', 'forest', 6, 0, ''],
      [2, -2, 'Blood on the Clocktower', 'marsh', 3, 0, ''], [3, -2, 'The Resistance', 'marsh', 5, 0, ''], [3, -3, 'Decrypto', 'marsh', 1, 0, ''],
      [-2, 2, 'Dune: Imperium', 'peaks', 3, 0, ''], [-3, 2, 'Twilight Imperium', 'peaks', 2, 0, 'Kabir holds the crown'], [0, 2, 'Pandemic', 'meadow', 6, 0, ''],
      [1, 2, 'Hanabi', 'meadow', 2, 0, ''], [-1, 2, 'Forbidden Island', 'meadow', 1, 0, ''], [-1, -1, 'Patchwork', 'tundra', 6, 0, ''],
      [0, -3, 'Telestrations', 'reef', 1, 0, ''], [3, -1, 'Brass', 'forest', 1, 0, ''], [2, 1, 'Gloomhaven', 'meadow', 3, 0, '']
    ];
    var shelf = { '3,0': 'Sky Team', '-3,1': 'Arcs', '2,-3': 'Heat' };
    var byPos = {};
    games.forEach(function (g) { byPos[g[0] + ',' + g[1]] = g; });
    var sel = this.state.sel;
    function pick(key) { return function () { self.setState({ sel: key }); }; }
    var w = 50, h = 58, cx = 179, cy = 161, tiles = [], selCard = null;
    for (var r = -3; r <= 3; r++) {
      for (var q = -3; q <= 3; q++) {
        if (Math.abs(-q - r) > 3) continue;
        var key = q + ',' + r, g = byPos[key];
        var x = cx + w * (q + r / 2) - w / 2, y = cy + 0.75 * h * r - h / 2;
        var on = key === sel;
        if (g) {
          var t = tier(g[4]), c = T[g[3]];
          tiles.push({ x: x, y: y, face: c[0], side: c[1], ink: c[2], building: B[t], size: SIZE[t], crown: g[5] ? 1 : 0,
            mono: MONO[g[2]] || g[2], glow: on ? '#F5C84B' : 'rgba(0,0,0,0)', pick: pick(key), label: g[2] + ', ' + t + ', ' + g[4] + ' plays' });
          if (on) {
            var nx = NEXT[t], bits = [t + ', ' + g[4] + ' plays'];
            if (nx) bits.push((nx[0] - g[4]) + ' to ' + nx[1]);
            if (g[6]) bits.push(g[6]);
            selCard = { name: g[2], line: bits.join('. '), href: 'TileDetail.dc.html', cta: 'Open' };
          }
        } else if (shelf[key]) {
          tiles.push({ x: x, y: y, face: on ? '#23506F' : '#17405E', side: 'rgba(0,0,0,0)', ink: '#9DB7C9', building: '', size: 0, crown: 0,
            mono: '?', glow: on ? '#F5C84B' : 'rgba(0,0,0,0)', pick: pick(key), label: shelf[key] + ', unplayed, on your shelf' });
          if (on) selCard = { name: shelf[key], line: 'On your shelf, never played. +80 XP bounty.', href: 'Shelf.dc.html', cta: 'Propose' };
        } else {
          tiles.push({ x: x, y: y, face: 'rgba(255,255,255,0.05)', side: 'rgba(0,0,0,0)', ink: '#FFFFFF', building: '', size: 0, crown: 0,
            mono: '', glow: 'rgba(0,0,0,0)', pick: pick(key), label: 'Unexplored' });
        }
      }
    }
    if (!selCard) selCard = { name: 'Unexplored', line: 'Play a new game to settle this spot.', href: 'Shelf.dc.html', cta: 'Your shelf' };
    var list = games.slice().sort(function (a, b) { return b[4] - a[4]; }).slice(0, 9).map(function (g) {
      var t = tier(g[4]), c = T[g[3]];
      return { name: g[2], plays: g[4], tier: t, face: c[0], ink: c[2], building: B[t] };
    });
    var isMap = this.state.view === 'map';
    return {
      tiles: tiles, sel: selCard, list: list, isMap: isMap, isList: !isMap,
      showMap: function () { self.setState({ view: 'map' }); }, showList: function () { self.setState({ view: 'list' }); },
      mapBg: isMap ? '#F5C84B' : 'transparent', mapFg: isMap ? '#0F2E45' : '#9DB7C9',
      listBg: isMap ? 'transparent' : '#F5C84B', listFg: isMap ? '#9DB7C9' : '#0F2E45'
    };
  }
}
</script>
</body>
</html>
