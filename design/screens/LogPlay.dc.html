<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a quest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&amp;family=Big+Shoulders+Display:wght@600..900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5C84B}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F2E45; color: #EAF2F7; font-family: 'Archivo', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 12px 12px 4px">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EAF2F7">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 700">Log a quest</h1>
    <span></span>
  </header>

  <section style="margin: 6px 16px 0; background: #17405E; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px">
    <div aria-hidden="true" style="position: relative; width: 48px; height: 56px; flex: none">
      <div style="position: absolute; left: 0; right: 0; top: 5px; height: 51px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #245C38"></div>
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 51px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background: #3E9B5F; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2 18 11h-3.5l4.5 7H5l4.5-7H6z" fill="#FFFFFF"></path></svg>
      </div>
    </div>
    <div style="flex: 1">
      <div style="font: 800 26px/1 'Big Shoulders Display', sans-serif">Cascadia</div>
      <div style="font-size: 13px; color: #9DB7C9; margin-top: 3px">Forest quest, highest score wins</div>
    </div>
    <button style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: #F5C84B; font: 700 14px 'Archivo', sans-serif">Change</button>
  </section>

  <section style="margin: 8px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <label style="background: #17405E; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #9DB7C9">When
      <input value="Today, 9:40 PM" style="border: 0; padding: 0; font: 600 14px 'Archivo', sans-serif; color: #EAF2F7; background: transparent; width: 100%"></label>
    <label style="background: #17405E; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #9DB7C9">Where
      <input value="Priya’s place" style="border: 0; padding: 0; font: 600 14px 'Archivo', sans-serif; color: #EAF2F7; background: transparent; width: 100%"></label>
    <label style="background: #17405E; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #9DB7C9">Length
      <input value="48 min" style="border: 0; padding: 0; font: 600 14px 'Archivo', sans-serif; color: #EAF2F7; background: transparent; width: 100%"></label>
  </section>

  <h2 style="margin: 18px 20px 8px; font-size: 15px; font-weight: 700">Your party</h2>
  <div style="margin: 0 16px; background: #17405E; border-radius: 16px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 44px 32px 1fr auto; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid #23506F">
        <span style="font: 800 18px 'Big Shoulders Display', sans-serif; color: {{r.posColor}}">{{r.pos}}</span>
        <span style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: {{r.bg}}; color: {{r.fg}}; box-shadow: {{r.crown}}">{{r.initial}}</span>
        <span style="font-size: 16px; font-weight: 600">{{r.name}}</span>
        <div style="display: flex; align-items: center; gap: 2px">
          <button aria-label="Lower score" onClick="{{r.dec}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #0F2E45; color: #EAF2F7; font: 700 20px 'Archivo', sans-serif">−</button>
          <span style="min-width: 44px; text-align: center; font: 900 26px 'Big Shoulders Display', sans-serif">{{r.score}}</span>
          <button aria-label="Raise score" onClick="{{r.inc}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #0F2E45; color: #EAF2F7; font: 700 20px 'Archivo', sans-serif">+</button>
        </div>
      </div>
    </sc-for>
    <button style="width: 100%; height: 52px; border: 0; background: transparent; color: #F5C84B; font: 700 15px 'Archivo', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Add a party member or guest</button>
  </div>
  <p style="margin: 10px 20px 0; font-size: 13px; color: #9DB7C9">Places update as you score. XP is shared out when you complete the quest.</p>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: #0A2236; border-top: 1px solid #1C4462">
    <a href="QuestComplete.dc.html" style="height: 56px; border-radius: 28px; background: #F5C84B; color: #0F2E45; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 800">Complete quest</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scores: [91, 94, 87, 79] };
  }
  renderVals() {
    var self = this;
    var people = [['Ciao', '#2459B8', '#FFFFFF'], ['Priya', '#2E7D4F', '#FFFFFF'], ['Ravi', '#C8323B', '#FFFFFF'], ['Meera', '#E8A80C', '#1B1F3B']];
    var scores = this.state.scores;
    function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
    function step(i, d) {
      return function () {
        var next = self.state.scores.slice();
        next[i] = Math.max(0, next[i] + d);
        self.setState({ scores: next });
      };
    }
    var rows = people.map(function (p, i) {
      var above = scores.filter(function (s) { return s > scores[i]; }).length;
      var tied = scores.filter(function (s) { return s === scores[i]; }).length > 1;
      return {
        name: p[0], initial: p[0].charAt(0), score: scores[i], bg: p[1], fg: p[2],
        pos: (tied ? '=' : '') + ord(above + 1), posColor: above === 0 ? '#F5C84B' : '#9DB7C9',
        crown: above === 0 ? '0 0 0 2px #17405E, 0 0 0 4px #F5C84B' : 'none',
        dec: step(i, -1), inc: step(i, 1)
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
